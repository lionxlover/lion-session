# lion-session CI — every merge gate, one file (mirrors lion-greeter's).
#
# * --locked everywhere: CI builds exactly the reviewed Cargo.lock.
# * Integration tests spawn the real binary against a private
#   dbus-daemon with mock locker/power/logind peers — fully offline.
# * The live suite (scripts/live_session_test.sh) re-runs them in one
#   command for packagers.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    name: clippy (all targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets --locked -- -D warnings

  tests:
    name: unit + integration + fuzz harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all-targets
      - name: live session suite (one command)
        run: bash scripts/live_session_test.sh

  msrv:
    name: MSRV (rust 1.74)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.74"
      - run: cargo check --locked

  audit:
    name: cargo-audit (supply chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: release build + checksum
    runs-on: ubuntu-latest
    needs: [fmt, lint, tests, msrv]
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: |
          sha256sum target/release/lion-session > lion-session.sha256
          stat -c '%s bytes' target/release/lion-session
      - uses: actions/upload-artifact@v4
        with:
          name: lion-session-${{ github.ref_name }}
          path: |
            target/release/lion-session
            lion-session.sha256
