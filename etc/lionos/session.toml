# Default LionOS session configuration.
# Copy to ~/.config/lionos/session.toml to override per-user; entries here
# merge with the built-in defaults (autostart apps merge by name).
# `LION_SESSION_CONFIG=/path/to.toml` replaces both layers (for testing).
# Validate with `lion-session --check-config`.

logout-animation-ms = 350

[compositor]
command = "lion-compositor"
args = []
wayland-display = "wayland-1"
ready-timeout-ms = 15000
# Crash recovery: respawn a crashed compositor instead of ending the
# session (like GNOME's automatic shell restart, for any compositor).
restart = true
max-restarts = 3
crash-window-ms = 60000

[session]
# How long apps may answer QueryEndSession / hold inhibitors before the
# end is forced. Bounded on purpose: a wedged app can never hang logout.
end-timeout-ms = 10000
# Lock the screen when the system suspends, so resume needs re-auth.
lock-on-sleep = true
# Honor /etc/xdg/autostart + ~/.config/autostart desktop entries
# (the cross-desktop autostart standard).
xdg-autostart = true
# Supervise XDG autostart apps (restart on failure) instead of the
# fire-and-forget semantics other desktops use.
supervise-xdg = false
# "auto": launch autostart apps in systemd --user scopes when a user
# manager is reachable (visible in systemctl --user, own cgroup), else
# direct children. "never": always direct children.
via = "auto"
# Lock the screen the moment logind announces an imminent shutdown: a
# shutdown can still be cancelled (another inhibitor, `shutdown -c`),
# and a cancelled shutdown must leave a locked session, not an
# exposed one. Default true.
lock-on-shutdown = true
# Idle escalation (0.3.0). The desktop's idle detector reports idle
# via SetIdle(); after lock-after-ms of idle the session locks, and
# after logout-after-ms it logs out cooperatively (kiosk policy).
# Zero (the default) disables each stage independently.
lock-after-ms = 0
logout-after-ms = 0

[services]
locker-service = "os.lionos.Locker"
locker-path = "/os/lionos/Locker"
locker-interface = "os.lionos.Locker1"
power-service = "os.lionos.Power"
power-path = "/os/lionos/Power"
power-interface = "os.lionos.Power1"

# Autostart apps. "phase" orders startup: display < shell <
# session-services < applications. XDG autostart entries always run last.
# [[autostart]]
# name = "lion-dock"
# enabled = false
# [[autostart]]
# name = "my-app"
# command = "/opt/my-app"
# args = ["--flag"]
# phase = "applications"
# restart = "on-failure"   # never | on-failure | always
# delay-ms = 0
# Per-app cgroup resource limits (systemd scopes only; inert with
# via = "never", which logs the fact):
# memory-max = "512M"
# cpu-weight = 250         # 1..=10000
# tasks-max = 128
